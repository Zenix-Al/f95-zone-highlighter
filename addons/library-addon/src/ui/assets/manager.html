<div class="f95ue-library-manager-root">
  <div
    class="f95ue-library-manager-window"
    role="document"
    aria-label="Library Manager"
    tabindex="-1"
  >
    <div class="f95ue-library-header">
      <div class="f95ue-library-title">Library Manager</div>
      <button type="button" data-action="close">Close</button>
    </div>

    <div class="f95ue-library-toolbar">
      <div class="f95ue-library-search-wrap">
        <input type="search" placeholder="Search title, id, tags..." data-field="search" />
        <span
          class="f95ue-library-search-help"
          title="Advanced search: tag:ntr status:playing score>=8 pinned has:note id:123"
          >?</span
        >
      </div>
      <select data-field="status">
        <option value="all">All Status</option>
        <option value="saved">saved</option>
        <option value="playing">playing</option>
        <option value="completed">completed</option>
        <option value="dropped">dropped</option>
      </select>
      <select data-field="sort">
        <option value="updatedAt:desc">Updated (Newest)</option>
        <option value="updatedAt:asc">Updated (Oldest)</option>
          <option value="title:asc">Title (A-Z)</option>
          <option value="rating:desc">My Rating (Highest)</option>
          <option value="rating:asc">My Rating (Lowest)</option>
        <option value="title:desc">Title (Z-A)</option>
      </select>
      <select data-field="pageSize" title="Rows per page">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="200">200 / page</option>
      </select>
    </div>

    <div class="f95ue-library-actions">
      <label class="bulk-select-all"
        ><input type="checkbox" data-action="toggle-all" /> All</label
      >
      <span data-role="selectedInfo">0 selected</span>
      <button type="button" data-action="check-selected-updates">Check for updates</button>
      <details class="f95ue-library-more-actions f95ue-library-bulk-actions">
        <summary>Bulk actions</summary>
        <div class="f95ue-library-more-grid">
          <label>
            <span>Apply to selected records</span>
            <select data-field="bulkAction">
              <option value="status:saved">Status: saved</option>
              <option value="status:backlog">Status: backlog</option>
              <option value="status:playing">Status: playing</option>
              <option value="status:paused">Status: paused</option>
              <option value="status:completed">Status: completed</option>
              <option value="status:dropped">Status: dropped</option>
              <option value="pin">Pin selected</option>
              <option value="unpin">Unpin selected</option>
              <option value="auto-enable">Enable auto update</option>
              <option value="auto-disable">Disable auto update</option>
              <option value="remove">Remove selected</option>
              <option value="clear">Clear selection</option>
            </select>
          </label>
          <button type="button" data-action="bulk-apply">Apply</button>
        </div>
      </details>
      <button type="button" data-action="open-auto-update">Auto update</button>
      <button type="button" data-action="open-updates">
        Updates <span data-role="updatesCount">0</span>
      </button>
      <div
        id="f95ue-library-rows-status"
        class="f95ue-library-status-line f95ue-library-toolbar-status"
        role="status"
        aria-live="polite"
      ></div>
      <button type="button" data-action="cancel-manual-check" data-role="cancelManualCheck" hidden>
        Cancel check
      </button>
      <details class="f95ue-library-more-actions f95ue-library-export-actions">
        <summary>Export</summary>
        <div class="f95ue-library-more-grid">
          <label>
            <span>Records to export</span>
            <select data-field="exportScope">
              <option value="all">All records</option>
              <option value="filtered">Filtered records</option>
              <option value="selected">Selected records</option>
            </select>
          </label>
          <button type="button" data-action="export">Export JSON</button>
          <label>
            <span>Import policy</span>
            <select data-field="conflictPolicy">
              <option value="newer">Newer Wins</option>
              <option value="replace">Replace Existing</option>
              <option value="skip">Skip Existing</option>
            </select>
          </label>
          <button type="button" class="ghost" data-action="import">Import JSON</button>
        </div>
      </details>
      <input type="file" data-field="importFile" accept="application/json,.json" hidden />
    </div>

    <div class="f95ue-library-layout">
      <div class="f95ue-library-list-panel">
        <div class="f95ue-library-table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-check"></th>
                <th>Title</th>
                <th>Status</th>
                  <th>My Rating</th>
                <th>Updated</th>
                <th>Prefixes</th>
                <th>Version</th>
                <th>Developer</th>
                <th>Tags</th>
                <th>Note</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody data-role="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="f95ue-library-footer">
      <button type="button" data-action="prev">Prev</button>
      <span data-role="pageInfo">Page 1</span>
      <button type="button" data-action="next">Next</button>
    </div>
  </div>
</div>
